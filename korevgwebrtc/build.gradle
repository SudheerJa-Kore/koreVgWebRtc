apply plugin: 'com.android.library'
apply plugin: 'maven-publish'

dependencies {
    api 'androidx.annotation:annotation:1.10.0'
}

android {
    namespace 'com.korevg.mv.webrtcsdk'
    compileSdk 35

    defaultConfig {
        minSdkVersion 26
    }

    publishing {
        singleVariant('release')
    }

    buildFeatures {
        buildConfig false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                groupId = project.findProperty('group') ?: 'com.github.SudheerJa-Kore'
                artifactId = project.name
                version = project.findProperty('version') ?: '1.0.0'
                from components.release
            }
        }
    }
}

plugins {
    id 'com.android.application'
}

android {
    namespace 'com.korevg.webrtcsdk.demo'
    compileSdk 35

    defaultConfig {
        applicationId 'com.korevg.webrtcsdk.demo'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation project(':korevgwebrtc')
}
